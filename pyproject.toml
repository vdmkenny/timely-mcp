[project]
name = "timely-mcp"
version = "0.2.0"
description = "MCP server for safe Timely time tracking and timesheet backfills"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]==2.0.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "urllib3==2.7.0",
]
[project.scripts]
timely-mcp = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
py-modules = ["main"]
